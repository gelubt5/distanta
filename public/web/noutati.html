         function goforward()
         {              
         $('.btn').sideNav('hide');             
         // Web version - use browser geolocation
         if (navigator.geolocation) {
             navigator.geolocation.getCurrentPosition(function(pos) {
                 localStorage.setItem("lat6", pos.coords.latitude);
                 localStorage.setItem("lng6", pos.coords.longitude);
                 localStorage.setItem("lat42", "0");
                 localStorage.setItem("lng42", "0");
                 window.location.href = "locatiacurenta.html";
             }, function(error) {
                 alert('GPS error: ' + error.message);
             });
         } else {
             alert('Geolocation not supported');
         }
         }
