    <script>
        app.SetOnKey(OnKey);
        function OnKey(action, name, code, extra) {
            if (code == 4 && action == "Up") {

                setTimeout(function () {

                }, 350);

            }
        }

            var yesNo = app.CreateYesNoDialog("Exit App?");

        }
