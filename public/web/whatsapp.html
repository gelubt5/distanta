		function goforward() {
			$('.btn').sideNav('hide');
			loc2 = app.CreateLocator("GPS");
			loc2.SetOnChange(function (pos) {
				localStorage.setItem("lat6", pos.latitude);
				localStorage.setItem("lng6", pos.longitude);
				localStorage.setItem("lat42", "0");
				localStorage.setItem("lng42", "0");
				loc2.Stop();
				window.location.href = "locatiacurenta.html";
			});
			loc2.SetRate(1);
			loc2.Start();
		}
	</script>
