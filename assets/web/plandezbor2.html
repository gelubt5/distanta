             function sendToReactNative(action, data) {
                if (typeof window.ReactNativeWebView !== 'undefined' && window.ReactNativeWebView) {
                    try {
                        var message = action + ':' + (typeof data === 'object' ? JSON.stringify(data) : data);
                        window.ReactNativeWebView.postMessage(message);
                        return true;
                    } catch(e) {
                        return false;
                    }
                }
                return false;
            }

         function playbeep() {
            try {
                var x = document.getElementById("myAudio");
                if (x) {
                    x.currentTime = 0;
                    x.volume = 0.05;
                    var playPromise = x.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function(error) {
                            console.log('Audio playback failed:', error);
                        });
                    }
                }
            } catch(e) {
                console.log('Playbeep error:', e);
            }
        }
    </script>

       function goBack() {
            playbeep();
            setTimeout(function () {
                window.location.href = "plandezbor.html";
            }, 350);
        }
        
        // Listen for back button events
        window.addEventListener('popstate', function(e) {
            e.preventDefault();
            goBack();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                e.preventDefault();
                goBack();
            }
        });
        
        document.addEventListener('backbutton', function(e) {
            e.preventDefault();
            goBack();
        });
        
        function exit() {
			if (window.ReactNativeWebView) {
				window.ReactNativeWebView.postMessage('showExitDialog');
			} else {
				if (confirm("Exit App?")) {
					window.close();
				}
			}
		}

                    function(position) {
                        localStorage.setItem("lat6", position.coords.latitude);
                        localStorage.setItem("lng6", position.coords.longitude);
                        localStorage.setItem("lat42", "0");
                        localStorage.setItem("lng42", "0");
                        window.location.href = "locatiacurenta.html";
                    },
                    function(error) {
                        console.error('Geolocation error:', error);
                        alert(language.activeazagpsul || 'Please enable GPS');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {

       function doscreenshot() {
                setTimeout(function () {
                    const node = document.body;
                    const scale = 3000 / node.offsetWidth;

                    domtoimage
                        .toJpeg(node, {
                            height: node.offsetHeight * scale,
                            width: node.offsetWidth * scale,
                            style: {
                                transform: "scale(" + scale + ")",
                                transformOrigin: "top left",
                                width: node.offsetWidth + "px",
                                height: node.offsetHeight + "px"
                            }
                        })
                        .then(dataUrl => {
                            var dt = new Date();
                            var filename = "plan_" + formatDate(dt) + ".jpg";
                                 localStorage.setItem("lastplan", filename);
                            // Send base64 image data to React Native for saving
                            // React Native will set localStorage.lastroute with the full path and show success alert
                            if (sendToReactNative('saveScreenshot', JSON.stringify({
                                filename: filename,
                                dataUrl: dataUrl
                            }))) {
                                // Success alert will be shown by React Native after save completes
                                return;
                            } else {
                                // Fallback: offer download in browser
                                localStorage.setItem("lastplan", filename);
                                var link = document.createElement('a');
                                link.download = filename;
                                link.href = dataUrl;
                                link.click();
                                alert(language.efectuat + "\n" + filename);
                            }
                        })
                        .catch(error => {
                            alert(language.nusepoatefacescrenshot || 'Screenshot failed');
                        });
                }, 500);
            }

        function padTo2Digits(num) {
            return num.toString().padStart(2, '0');
        }

        function formatDate(date) {
            return (
                [
                    date.getFullYear(),
                    padTo2Digits(date.getMonth() + 1),
                    padTo2Digits(date.getDate()),
                ].join('_') +
                '_' +
                [
                    padTo2Digits(date.getHours()),
                    padTo2Digits(date.getMinutes()),
                    padTo2Digits(date.getSeconds()),
                ].join('_')
            );
        }
