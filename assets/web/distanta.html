    // Check if GPS/Location is enabled and prompt user to activate it
    function activeazagpsul() {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage('checkGPS');
      } else {
        // Fallback for web - try to get location
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(position) {
              console.log('GPS is enabled');
            },
            function(error) {
              if (error.code === error.PERMISSION_DENIED) {
                alert('Please enable GPS/Location services');
              }
            }
          );
        } else {
          alert(language.locationnotsupported || 'Geolocation not supported');
        }
      }
    }
