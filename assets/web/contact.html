   <script>
  function playbeep() {
            try {
                var x = document.getElementById("myAudio");
                if (x) {
                    x.currentTime = 0;
                    x.volume = 0.05;
                    var playPromise = x.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function(error) {
                            // Autoplay was prevented, ignore silently
                            console.log('Audio playback failed:', error);
                        });
                    }
                }
            } catch(e) {
                console.log('Playbeep error:', e);
            }
        }
		
		// Handle back button - go back to distanta2.html
		function goBack() {
			playbeep();
			setTimeout(function () {
				window.location.href = "distanta2.html";
			}, 350);
		}
		
		// Listen for back button via popstate
		window.addEventListener('popstate', function(event) {
			event.preventDefault();
			goBack();
			history.pushState(null, null, window.location.href);
		});
		
		// Push initial state to enable popstate handling
		history.pushState(null, null, window.location.href);
		
		function exit() {
			// Send message to React Native to show exit dialog
			if (window.ReactNativeWebView) {
				window.ReactNativeWebView.postMessage('showExitDialog');
			}
		}
		</script>
