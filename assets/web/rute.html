                    x.currentTime = 0;
                    x.volume = 0.05;
                    var playPromise = x.play();

        }

    <script>
      function goBack() {
            playbeep();
            setTimeout(function () {
                window.location.href = "distanta2.html";
            }, 350);
        }
        
        // Listen for back button events
        window.addEventListener('popstate', function(e) {
            e.preventDefault();
            goBack();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                e.preventDefault();
                goBack();
            }
        });
        
        document.addEventListener('backbutton', function(e) {
            e.preventDefault();
            goBack();
        });
        
        function exit() {
			if (window.ReactNativeWebView) {
				window.ReactNativeWebView.postMessage('showExitDialog');

				if (confirm("Exit App?")) {

				}
			}
		}
