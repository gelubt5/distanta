        // Global error handler - catch all JS errors
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('=== JAVASCRIPT ERROR ===');
            console.error('Message:', message);
            console.error('Source:', source);
            console.error('Line:', lineno, 'Col:', colno);
            console.error('Error:', error);
            // Send error to React Native for debugging
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage('jsError:' + message + ' at line ' + lineno);
            }
            return false; // Don't prevent default error handling
        };
        
        // Track script loading - define BEFORE any scripts use onload callbacks
        var scriptsLoaded = {};
        function scriptLoaded(name) {
            scriptsLoaded[name] = true;
            console.log('✓ Script loaded: ' + name);
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage('scriptLoaded:' + name);
            }
        }
        function scriptFailed(name) {
            console.error('✗ Script FAILED to load: ' + name);
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage('jsError:Script failed to load: ' + name);
            }
        }
    </script>

            // Helper function for sharing text
            window.shareTextNative = function(text) {
                try {
                    // Try React Native WebView first
                    if (typeof window.ReactNativeWebView !== 'undefined' && window.ReactNativeWebView) {
                        try {
                            window.ReactNativeWebView.postMessage('shareText:' + text);
                            return;
                        } catch(e) {
                            console.error('postMessage error:', e);
                        }
                    }
                    
                    // Fallback to Web Share API
                    if (navigator.share) {
                        navigator.share({ 
                            text: text,
                            title: 'Route Information'
                        }).catch(function(err) {
                            console.error('Share API failed:', err);
                            attemptClipboardCopy(text);
                        });
                        return;
                    }
                    
                    // Final fallback: clipboard
                    attemptClipboardCopy(text);
                    
                } catch(e) {
                    console.error('Error in shareTextNative:', e);
                    //alert('Share error: ' + e.message);
                }
            };
            
            function attemptClipboardCopy(text) {
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(function() {
                            alert(language.copiat || 'Copied to clipboard!');
                        }).catch(function(err) {
                            fallbackCopy(text);
                        });
                    } else {
                        fallbackCopy(text);
                    }
                } catch(e) {
                    fallbackCopy(text);
                }
            }
            
            function fallbackCopy(text) {
                try {
                    var textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-999999px";
                    document.body.appendChild(textArea);
                    textArea.select();
                    var success = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    if (success) {
                        alert(language.copiat || 'Copied to clipboard!');
                    } else {
                        //alert('Copy failed');
                    }
                } catch(e) {
                    //alert('Copy failed: ' + e.message);
                }

            function doscreenshot() {
                setTimeout(function () {
                    const node = document.body;
                    const scale = 3000 / node.offsetWidth;

                    domtoimage
                        .toJpeg(node, {
                            height: node.offsetHeight * scale,
                            width: node.offsetWidth * scale,
                            style: {
                                transform: "scale(" + scale + ")",
                                transformOrigin: "top left",
                                width: node.offsetWidth + "px",
                                height: node.offsetHeight + "px"
                            }
                        })
                        .then(dataUrl => {
                            var dt = new Date();
                            var filename = "route_" + formatDate(dt) + ".jpg";
                            
                            // Send base64 image data to React Native for saving
                            // React Native will set localStorage.lastroute with the full path and show success alert
                            if (sendToReactNative('saveScreenshot', JSON.stringify({
                                filename: filename,
                                dataUrl: dataUrl
                            }))) {
                                // Success alert will be shown by React Native after save completes
                                return;
                            } else {
                                // Fallback: offer download in browser
                                localStorage.setItem("lastroute", filename);
                                var link = document.createElement('a');
                                link.download = filename;
                                link.href = dataUrl;
                                link.click();
                                alert(language.efectuat + "\n" + filename);
                            }
                        })
                        .catch(error => {
                            alert(language.nusepoatefacescrenshot || 'Screenshot failed');
                        });
                }, 500);
            }

            function padTo2Digits(num) {
                return num.toString().padStart(2, '0');
            }

            function formatDate(date) {
                return (
                    [
                        date.getFullYear(),
                        padTo2Digits(date.getMonth() + 1),
                        padTo2Digits(date.getDate()),
                    ].join('_') +
                    '_' +
                    [
                        padTo2Digits(date.getHours()),
                        padTo2Digits(date.getMinutes()),
                        padTo2Digits(date.getSeconds()),
                    ].join('_')
                );
            }
