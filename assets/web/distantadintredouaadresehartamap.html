    <script>
        function playbeep() {
            var x = document.getElementById("myAudio");
            x.currentTime = 0;
            x.volume = 0.05;
            x.play();
        }
        function activeazagpsul() {
            var locEnabled = app.IsLocationEnabled('GPS');
            if (locEnabled == true) {
            } else {
                alert(language.activeazagpsul);
                window.location.href = "distantadintredouaadrese.html";
            }
        }
        var fromroute = 0;
        app.SetOnKey(OnKey);
        function OnKey(action, name, code, extra) {
            if (code == 4 && action == "Up") {
                playbeep();

                if (localStorage.getItem("lat32") != "0" && localStorage.getItem("lng32") != "0" && localStorage.getItem("lat33") != "0" && localStorage.getItem("lng33") != "0") {

                    fromroute = 1;
                }
                if (fromroute == 1) {
                    setTimeout(function () {
                        window.location.href = "rute.html";
                    }, 350);
                } else {
                    setTimeout(function () {
                        window.location.href = "distantadintredouaadrese.html";
                    }, 350);
                }
            }
        }
        function exit() {
            var yesNo = app.CreateYesNoDialog("Exit App?");
            yesNo.SetOnTouch(yesNo_OnTouch);
            yesNo.Show();
        }
        function yesNo_OnTouch(result) {
            if (result == "Yes") app.Exit();
        }
    </script>
    <script>

        function goforward() {
            $('.btn').sideNav('hide');
            loc2 = app.CreateLocator("GPS");
            loc2.SetOnChange(function (pos) {
                localStorage.setItem("lat6", pos.latitude);
                localStorage.setItem("lng6", pos.longitude);
                localStorage.setItem("lat42", "0");
                localStorage.setItem("lng42", "0");
                loc2.Stop();
                window.location.href = "locatiacurenta.html";
            });
            loc2.SetRate(1);
            loc2.Start();
        }
        if (localStorage.getItem("tiplinie").includes("da")) {
            $('.headertop').css("display", "block");
            $('.headertop2').css("display", "none");
            console.log(localStorage.getItem("tiplinie"));

        if (localStorage.getItem("tiplinie").includes("nu")) {

            console.log(localStorage.getItem("tiplinie"));
        }
        console.log(localStorage.getItem("tiplinie"));

        function salveazaruta() {
            var ruta = prompt(language.introdunumelerutei + ":");
            if (ruta != null) {
                $(document).ready(function () {
                    var email = localStorage.getItem("email");
                    var parola = localStorage.getItem("parola");
                    var lat1 = window["lat2"];
                    var lng1 = window["lng2"]
                    var lat2 = window["lat3"]
                    var lng2 = window["lng3"]
                    if (localStorage.getItem("tiplinie").includes("da")) {
                        var tip = 1;
                    } else {
                        var tip = 2;
                    }
                    //alert(ruta+"---"+lat1+"---"+lng1+"---"+lat2+"---"+lng2);
                    $.post("https://evidentacolumbofila.eu/public/salveazarutanoua", { 'email': email, 'parola': parola, 'ruta': ruta, 'lat1': lat1, 'lng1': lng1, 'lat2': lat2, 'lng2': lng2, 'tip': tip, 'cheie': localStorage.getItem('cheie') }, function (data, status) {

                        var data2 = JSON.parse(data);
                        if (data2[0] == 1) {
                            alert(language.rutasalvatacusucces);
                        } else {
                            if (data2[2] == -2) {
                                var alert2 = language.utilizatorulnuexista;
                            }
                            if (data2[2] == -1) {
                                var alert2 = language.continactiv;
                            }
                            if (data2[2] == 1) {
                                var alert2 = language.rutaintrodusaexistadeja;
                            }
                            if (data2[2] == 2) {
                                var alert2 = language.eroare1;
                            }
                            if (data2[2] == 3) {
                                var alert2 = language.eroare2;
                            }
                            if (data2[2] == 4) {
                                var alert2 = language.eroare3;
                            }
                            if (data2[2] == 5) {
                                var alert2 = language.eroare4;
                            }
                            if (data2[2] == 6) {
                                var alert2 = language.eroare5;
                            }
                            if (data2[2] == 7) {
                                var alert2 = language.eroare6;
                            }
                            if (data2[2] == 8) {
                                var alert2 = language.eroare7;
                            }
                            if (data2[2] == 9) {
                                var alert2 = language.eroare8;
                            }
                            if (data2[2] == 10) {
                                var alert2 = language.eroare9;
                            }
                            if (data2[2] == 11) {
                                var alert2 = language.eroare10;
                            }

                            if (data2[2] == 13) {
                                var alert2 = language.eroarelabazadedate;
                            }
                            alert(alert2);
                        }
                    }).fail(function (data) {


                        console.log(data.responseJSON["error"]);
                        if (data.responseJSON["error"] != null && data.responseJSON["error"].includes("time")) {
                            alert(language.nuestilogat);
                            window.location.href = "_main_.html";
                        } else if (data.responseJSON["error"] != null && data.responseJSON["error"].includes("csrf")) {
                            alert(language.nuestilogat);
                            window.location.href = "_main_.html";
                        } else {
                            alert(language.eroare);
                        }
                    });
                });
            } else {
                alert(language.actiuneanulata);
            }


            return false;
        }

            function padTo2Digits(num) {
                return num.toString().padStart(2, '0');
            }

            function formatDate(date) {
                return (
                    [
                        date.getFullYear(),
                        padTo2Digits(date.getMonth() + 1),
                        padTo2Digits(date.getDate()),
                    ].join('_') +
                    '_' +
                    [
                        padTo2Digits(date.getHours()),
                        padTo2Digits(date.getMinutes()),
