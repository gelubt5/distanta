function playbeep() {
            try {
                var x = document.getElementById("myAudio");
                if (x) {
                    x.currentTime = 0;
                    x.volume = 0.05;
                    var playPromise = x.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function(error) {
                            // Autoplay was prevented, ignore silently
                            console.log('Audio playback failed:', error);
                        });
                    }
                }
            } catch(e) {
                console.log('Playbeep error:', e);
            }
        }
 </script>

    <script>
      function goBack() {
            playbeep();
            setTimeout(function () {
                window.location.href = "distanta2.html";
            }, 350);
        }
        
        // Listen for back button events
        window.addEventListener('popstate', function(e) {
            e.preventDefault();
            goBack();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' || e.keyCode === 27) {
                e.preventDefault();
                goBack();
            }
        });
        
        document.addEventListener('backbutton', function(e) {
            e.preventDefault();
            goBack();
        });
        
        function exit() {
			if (window.ReactNativeWebView) {
				window.ReactNativeWebView.postMessage('showExitDialog');

				}
			}
		}

function goforward() {
            $('.btn').sideNav('hide');
            // Use browser geolocation API instead of app.CreateLocator
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        localStorage.setItem("lat6", position.coords.latitude);
                        localStorage.setItem("lng6", position.coords.longitude);
                        localStorage.setItem("lat42", "0");
                        localStorage.setItem("lng42", "0");
                        window.location.href = "locatiacurenta.html";
                    },
                    function(error) {
                        console.error('Geolocation error:', error);
                        alert(language.activeazagpsul || 'Please enable GPS');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert(language.locationnotsupported || 'Geolocation not supported');
            }
        }
