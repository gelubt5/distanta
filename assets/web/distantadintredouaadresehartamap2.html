    <script>

        function goforward() {
            $('.btn').sideNav('hide');
            // Use browser Geolocation API instead of DroidScript
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    localStorage.setItem("lat6", position.coords.latitude);
                    localStorage.setItem("lng6", position.coords.longitude);
                    localStorage.setItem("lat42", "0");
                    localStorage.setItem("lng42", "0");
                    window.location.href = "locatiacurenta.html";
                }, function(error) {
                    console.error('Geolocation error:', error);
                    alert('Could not get location');
                });
            } else {
                alert(language.locationnotsupported);
            }
        }


        function salveazaruta() {
            var ruta = prompt(language.introdunumelerutei + ":");
            if (ruta != null) {
                $(document).ready(function () {
                    var email = localStorage.getItem("email");
                    var parola = localStorage.getItem("parola");
                    var lat1 = window["lat4"];
                    var lng1 = window["lng4"]
                    var lat2 = window["lat5"]
                    var lng2 = window["lng5"]
                    if (localStorage.getItem("tiplinie").includes("da")) {
                        var tip = 1;
                    } else {
                        var tip = 2;
                    }
                    //alert(ruta+"---"+lat1+"---"+lng1+"---"+lat2+"---"+lng2);
                    $.post("https://evidentacolumbofila.eu/public/salveazarutanoua", { 'email': email, 'parola': parola, 'ruta': ruta, 'lat1': lat1, 'lng1': lng1, 'lat2': lat2, 'lng2': lng2, 'tip': tip, 'cheie': localStorage.getItem('cheie') }, function (data, status) {

                        var data2 = JSON.parse(data);
                        if (data2[0] == 1) {
                            alert(language.rutasalvatacusucces);
                        } else {
                            if (data2[2] == -2) {
                                var alert2 = language.utilizatorulnuexista;
                            }
                            if (data2[2] == -1) {
                                var alert2 = language.continactiv;
                            }
                            if (data2[2] == 1) {
                                var alert2 = language.rutaintrodusaexistadeja;
                            }
                            if (data2[2] == 2) {
                                var alert2 = language.eroare1;
                            }
                            if (data2[2] == 3) {
                                var alert2 = language.eroare2;
                            }
                            if (data2[2] == 4) {
                                var alert2 = language.eroare3;
                            }
                            if (data2[2] == 5) {
                                var alert2 = language.eroare4;
                            }
                            if (data2[2] == 6) {
                                var alert2 = language.eroare5;
                            }
                            if (data2[2] == 7) {
                                var alert2 = language.eroare6;
                            }
                            if (data2[2] == 8) {
                                var alert2 = language.eroare7;
                            }
                            if (data2[2] == 9) {
                                var alert2 = language.eroare8;
                            }
                            if (data2[2] == 10) {
                                var alert2 = language.eroare9;
                            }
                            if (data2[2] == 11) {
                                var alert2 = language.eroare10;
                            }

                            if (data2[2] == 13) {
                                var alert2 = language.eroarelabazadedate;
                            }
                            alert(alert2);
                        }
                    }).fail(function (data) {


                        console.log(data.responseJSON["error"]);
                        if (data.responseJSON["error"] != null && data.responseJSON["error"].includes("time")) {
                            alert(language.nuestilogat);
                            window.location.href = "_main_.html";
                        } else if (data.responseJSON["error"] != null && data.responseJSON["error"].includes("csrf")) {
                            alert(language.nuestilogat);
                            window.location.href = "_main_.html";
                        } else {
                            alert(language.eroare);
                        }
                    });
                });
            } else {
                alert(language.actiuneanulata);
            }


            return false;
        }

        // Helper function to send messages to React Native
        function sendToReactNative(action, data) {
            if (typeof window.ReactNativeWebView !== 'undefined' && window.ReactNativeWebView) {
                try {
                    var message = action + ':' + (typeof data === 'object' ? JSON.stringify(data) : data);
                    window.ReactNativeWebView.postMessage(message);
                    console.log('Sent to RN:', message);
                    return true;
                } catch(e) {
                    console.error('Error sending to RN:', e);
                    return false;
                }
            }
            return false;
        }

        function doscreenshot() {
            // Capture screenshot using dom-to-image and send to React Native
            console.log('Taking screenshot...');
            
            setTimeout(function () {
                const node = document.body;
                const scale = 3000 / node.offsetWidth;

                domtoimage
                    .toJpeg(node, {
                        height: node.offsetHeight * scale,
                        width: node.offsetWidth * scale,
                        style: {
                            transform: "scale(" + scale + ")",
                            transformOrigin: "top left",
                            width: node.offsetWidth + "px",
                            height: node.offsetHeight + "px"
                        }
                    })
                    .then(dataUrl => {
                        var dt = new Date();
                        var filename = "route_" + formatDate(dt) + ".jpg";
                        localStorage.setItem("lastroute", filename);
                        
                        // Send base64 image data to React Native for saving
                        if (sendToReactNative('saveScreenshot', JSON.stringify({
                            filename: filename,
                            dataUrl: dataUrl
                        }))) {
                            console.log('Screenshot sent to React Native');
                            alert(language.efectuat + "\\n" + filename);
                        } else {
                            // Fallback: offer download in browser
                            var link = document.createElement('a');
                            link.download = filename;
                            link.href = dataUrl;
                            link.click();
                            alert(language.efectuat + "\\n" + filename);
                        }
                    })
                    .catch(error => {
                        console.error("Screenshot error:", error);
                        alert(language.nusepoatefacescrenshot || 'Screenshot failed');
                    });
            }, 500);
        }

        function padTo2Digits(num) {
            return num.toString().padStart(2, '0');
        }

        function formatDate(date) {
            return (
                [
                    date.getFullYear(),
                    padTo2Digits(date.getMonth() + 1),
                    padTo2Digits(date.getDate()),
                ].join('_') +
                '_' +
                [
                    padTo2Digits(date.getHours()),
                    padTo2Digits(date.getMinutes()),
                    padTo2Digits(date.getSeconds()),
                ].join('_')
            );
        }
